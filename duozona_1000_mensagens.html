<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duozona - 1000x A Melhor do Mundo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a; /* Soft slate dark */
      color: #f8fafc;
    }
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="min-h-screen pb-16 antialiased selection:bg-pink-500/30 selection:text-pink-200">

  <!-- Sticky Top Header & Controls -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-xl transition-all">
    <div class="max-w-6xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Title & Counter -->
      <div class="text-center sm:text-left">
        <h1 class="text-xl sm:text-2xl font-extrabold bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300 bg-clip-text text-transparent">
          Bloco de Notas Duozona
        </h1>
        <p class="text-xs text-slate-400 mt-0.5" id="progressText">Escrevendo 0 / 1.000 mensagens...</p>
      </div>

      <!-- Controls Group -->
      <div class="flex items-center justify-center gap-2.5">
        <button 
          onclick="toggleTyping()" 
          id="btnToggle" 
          class="px-3.5 py-2 text-xs sm:text-sm font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl transition flex items-center gap-1.5"
        >
          <span id="btnToggleIcon">⏸️</span> <span id="btnToggleText">Pausar</span>
        </button>

        <button 
          onclick="finishInstantly()" 
          class="px-3.5 py-2 text-xs sm:text-sm font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl transition flex items-center gap-1.5"
        >
          <span>⚡ Escrever Tudo</span>
        </button>
        
        <!-- Copy All Button -->
        <button 
          onclick="copyAllText()" 
          id="btnCopy" 
          class="px-4 py-2 text-xs sm:text-sm font-semibold bg-pink-600 hover:bg-pink-500 text-white rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-pink-900/20"
        >
          <span>📋 Copiar</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6">
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-emerald-600 text-white text-xs sm:text-sm font-semibold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 pointer-events-none">
      <span>✨ Texto copiado com sucesso!</span>
    </div>

    <!-- Notepad Paper View -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-4 sm:p-6 font-mono text-xs sm:text-sm text-slate-200 min-h-[500px] max-h-[80vh] overflow-y-auto leading-relaxed relative" id="notepadContainer">
      <div id="notepadContent" class="whitespace-pre-wrap break-words"></div><span id="cursor" class="inline-block w-2 h-4 bg-pink-400 align-middle animate-pulse ml-0.5"></span>
    </div>

  </main>

  <script>
    const MESSAGE = "duozona vc é a melhor do mundooo";
    const TOTAL_ITEMS = 1000;

    const notepadContent = document.getElementById('notepadContent');
    const notepadContainer = document.getElementById('notepadContainer');
    const progressText = document.getElementById('progressText');
    const btnToggleText = document.getElementById('btnToggleText');
    const btnToggleIcon = document.getElementById('btnToggleIcon');

    let currentLine = 1;
    let currentCharIndex = 0;
    let isTyping = true;
    let timeoutId = null;

    // Função de simulação de digitação humana
    function typeHumanStyle() {
      if (!isTyping) return;

      if (currentLine <= TOTAL_ITEMS) {
        const linePrefix = `${String(currentLine).padStart(4, '0')}. `;
        const fullLineToType = linePrefix + MESSAGE + "\n";

        // Adiciona um caractere por vez
        notepadContent.textContent += fullLineToType[currentCharIndex];
        currentCharIndex++;

        // Atualiza progresso e scroll
        progressText.textContent = `Escrevendo ${currentLine} / ${TOTAL_ITEMS} mensagens...`;
        notepadContainer.scrollTop = notepadContainer.scrollHeight;

        // Se terminou a linha atual, passa para a próxima linha
        if (currentCharIndex >= fullLineToType.length) {
          currentLine++;
          currentCharIndex = 0;
          
          // Pausa humana ligeiramente maior no final de cada frase (180ms - 350ms)
          const pauseAfterLine = Math.floor(Math.random() * 170) + 180;
          timeoutId = setTimeout(typeHumanStyle, pauseAfterLine);
        } else {
          // Intervalo entre teclas simula digitação humana rápida (25ms - 65ms com variações)
          let delay = Math.floor(Math.random() * 40) + 25;
          
          // Micro pausa ocasional ao digitar (como hesitação humana)
          if (Math.random() < 0.08) {
            delay += Math.floor(Math.random() * 100) + 80;
          }

          timeoutId = setTimeout(typeHumanStyle, delay);
        }
      } else {
        progressText.textContent = "✨ 1.000 mensagens concluídas!";
        document.getElementById('cursor').style.display = 'none';
      }
    }

    function startTyping() {
      if (timeoutId) clearTimeout(timeoutId);
      typeHumanStyle();
    }

    function toggleTyping() {
      if (currentLine > TOTAL_ITEMS) return;
      
      isTyping = !isTyping;
      if (isTyping) {
        btnToggleText.textContent = "Pausar";
        btnToggleIcon.textContent = "⏸️";
        typeHumanStyle();
      } else {
        btnToggleText.textContent = "Continuar";
        btnToggleIcon.textContent = "▶️";
        if (timeoutId) clearTimeout(timeoutId);
      }
    }

    function finishInstantly() {
      isTyping = false;
      if (timeoutId) clearTimeout(timeoutId);
      
      let fullContent = "";
      for (let i = 1; i <= TOTAL_ITEMS; i++) {
        fullContent += `${String(i).padStart(4, '0')}. ${MESSAGE}\n`;
      }
      notepadContent.textContent = fullContent;
      currentLine = TOTAL_ITEMS + 1;
      progressText.textContent = "✨ 1.000 mensagens concluídas!";
      document.getElementById('cursor').style.display = 'none';
      notepadContainer.scrollTop = notepadContainer.scrollHeight;
    }

    function copyAllText() {
      const fullText = notepadContent.textContent;
      if (!fullText) return;

      const textarea = document.createElement('textarea');
      textarea.value = fullText;
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast();
      } catch (err) {
        console.error('Erro ao copiar', err);
      }
      
      document.body.removeChild(textarea);
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // Inicia a escrita humana assim que a página carrega
    startTyping();
  </script>
</body>
</html>
