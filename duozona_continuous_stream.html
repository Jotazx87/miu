<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duozona - Continuous Animated Stream</title>
  <!-- CDN do Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #08070d;
      color: #ffffff;
      overflow: hidden;
    }

    /* Glow utility styles */
    .neon-text-pink {
      text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899, 0 0 40px #ec4899;
    }
    .neon-text-purple {
      text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7, 0 0 40px #a855f7;
    }
    .neon-text-cyan {
      text-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4, 0 0 40px #06b6d4;
    }

    /* Floating Bubble Animations */
    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0.7) rotate(-5deg);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-20vh) scale(1.1) rotate(5deg);
        opacity: 0;
      }
    }

    .floating-card {
      position: absolute;
      will-change: transform, opacity;
      animation: floatUp var(--duration, 8s) linear infinite;
      animation-delay: var(--delay, 0s);
      pointer-events: auto;
      cursor: pointer;
    }

    /* Click Burst Popup Animation */
    @keyframes burstPop {
      0% {
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.3) rotate(calc(var(--angle, 0deg)));
        opacity: 0.9;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8) rotate(calc(var(--angle, 0deg)));
        opacity: 0;
      }
    }

    .burst-text {
      position: absolute;
      pointer-events: none;
      animation: burstPop 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      white-space: nowrap;
      font-weight: 900;
      z-index: 40;
    }
  </style>
</head>
<body class="w-screen h-screen relative select-none bg-slate-950">

  <!-- Matrix / Stream Canvas Background -->
  <canvas id="matrixCanvas" class="absolute inset-0 z-0 w-full h-full block"></canvas>

  <!-- Container for Floating Floating HTML Cards -->
  <div id="bubblesContainer" class="absolute inset-0 z-10 overflow-hidden pointer-events-none"></div>

  <!-- Central Header Overlay -->
  <header class="absolute top-6 left-1/2 -translate-x-1/2 z-30 w-11/12 max-w-2xl bg-black/60 backdrop-blur-xl border border-purple-500/30 rounded-2xl p-4 sm:p-6 shadow-2xl shadow-purple-950/50 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 mb-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs font-semibold text-purple-300 tracking-wider uppercase">Fluxo Continuo Ativo</span>
    </div>
    
    <h1 class="text-2xl sm:text-4xl font-black bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500 bg-clip-text text-transparent tracking-tight">
      duozona vc é a melhor do mundooo
    </h1>

    <!-- Central Live Counter -->
    <div class="mt-4 flex items-center justify-center gap-3">
      <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Mensagens Geradas:</span>
      <span id="liveCounter" class="text-2xl sm:text-3xl font-black font-mono text-purple-400 neon-text-purple">0</span>
    </div>

    <p class="text-xs text-slate-400 mt-2">Clique em qualquer lugar da tela para estourar mensagens mágicas! ✨</p>
  </header>

  <!-- Interactive Control Bar -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex flex-wrap items-center justify-center gap-2 sm:gap-3 bg-black/70 backdrop-blur-xl border border-slate-800 p-2 sm:p-3 rounded-2xl shadow-2xl">
    
    <button id="btnSpeedSlow" onclick="setSpeed('slow')" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-purple-900/50 hover:text-purple-200 transition">
      🐢 Lento
    </button>
    
    <button id="btnSpeedNormal" onclick="setSpeed('normal')" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-purple-600 text-white shadow-lg shadow-purple-600/40 transition">
      ⚡ Normal
    </button>

    <button id="btnSpeedInsane" onclick="setSpeed('insane')" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-gradient-to-r from-pink-500 to-rose-600 text-white shadow-lg shadow-pink-500/40 transition">
      🔥 Modo Insano
    </button>

    <div class="w-px h-6 bg-slate-800 my-auto hidden sm:block"></div>

    <button id="btnPause" onclick="togglePause()" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-amber-400 hover:bg-amber-950/50 transition">
      ⏸️ Pausar
    </button>

    <button onclick="clearScreen()" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-rose-400 hover:bg-rose-950/50 transition">
      🧹 Limpar
    </button>
  </div>

  <script>
    // System Config & State
    const MESSAGE = "duozona vc é a melhor do mundooo";
    let messageCount = 0;
    let isPaused = false;
    let speedMultiplier = 1;

    const liveCounterEl = document.getElementById('liveCounter');
    const bubblesContainer = document.getElementById('bubblesContainer');

    function updateCounter(amount = 1) {
      if (isPaused) return;
      messageCount += amount;
      liveCounterEl.textContent = messageCount.toLocaleString('pt-BR');
    }

    // --- CANVAS MATRIX / CASCADE EFFECT ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = (canvas.width = window.innerWidth);
      height = (canvas.height = window.innerHeight);
      initMatrix();
    });

    const fontSize = 16;
    let columns = Math.floor(width / (fontSize * 12)); 
    let drops = [];

    const colors = ['#ec4899', '#a855f7', '#06b6d4', '#eab308', '#3b82f6', '#f43f5e'];

    function initMatrix() {
      columns = Math.floor(width / (fontSize * 14));
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = {
          y: Math.random() * -100,
          speed: 1 + Math.random() * 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          phraseOffset: Math.floor(Math.random() * MESSAGE.length)
        };
      }
    }
    initMatrix();

    function drawMatrix() {
      // Semi-transparent overlay to create trail effect
      ctx.fillStyle = 'rgba(8, 7, 13, 0.15)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = '900 15px Inter, sans-serif';

      for (let i = 0; i < drops.length; i++) {
        if (isPaused) continue;

        const drop = drops[i];
        const x = i * (fontSize * 14) + 10;
        
        ctx.fillStyle = drop.color;
        ctx.shadowColor = drop.color;
        ctx.shadowBlur = 8;
        
        ctx.fillText(MESSAGE, x, drop.y);

        // Reset shadow
        ctx.shadowBlur = 0;

        drop.y += drop.speed * 1.5 * speedMultiplier;

        // Count message generated when line crosses viewport
        if (Math.random() < 0.05 * speedMultiplier) {
          updateCounter(1);
        }

        // Reset drop position to top when reaching bottom
        if (drop.y > height && Math.random() > 0.95) {
          drop.y = -30;
          drop.color = colors[Math.floor(Math.random() * colors.length)];
        }
      }
    }

    // --- FLOATING BUBBLE CARDS SPAWNER ---
    function spawnFloatingCard() {
      if (isPaused) return;

      const card = document.createElement('div');
      card.className = "floating-card px-4 py-2.5 rounded-2xl bg-slate-900/80 border backdrop-blur-md shadow-xl flex items-center gap-2 border-purple-500/30";
      
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      card.style.borderColor = randomColor + '60';
      card.style.boxShadow = `0 8px 32px -4px ${randomColor}33`;

      const duration = (6 + Math.random() * 6) / speedMultiplier;
      card.style.setProperty('--duration', `${duration}s`);
      card.style.left = `${Math.random() * 85}%`;

      card.innerHTML = `
        <span class="w-2 h-2 rounded-full" style="background-color: ${randomColor}"></span>
        <span class="text-xs sm:text-sm font-bold tracking-wide text-white">
          ${MESSAGE}
        </span>
      `;

      // Interactive click on float cards
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerBurst(e.clientX, e.clientY);
        card.remove();
      });

      bubblesContainer.appendChild(card);
      updateCounter(1);

      // Self cleanup after animation completes
      setTimeout(() => {
        card.remove();
      }, duration * 1000);
    }

    // --- CLICK BURST PARTICLES ---
    function triggerBurst(x, y) {
      const burstCount = 6;
      for (let i = 0; i < burstCount; i++) {
        const burst = document.createElement('div');
        burst.className = 'burst-text text-sm sm:text-lg';
        burst.style.left = `${x}px`;
        burst.style.top = `${y}px`;
        
        const randomAngle = (Math.random() - 0.5) * 60;
        burst.style.setProperty('--angle', `${randomAngle}deg`);
        
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        burst.style.color = randomColor;
        burst.style.textShadow = `0 0 12px ${randomColor}`;
        burst.textContent = `${MESSAGE} 💕`;

        // Slight offset per particle
        const offsetX = (Math.random() - 0.5) * 120;
        const offsetY = (Math.random() - 0.5) * 120;
        burst.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

        document.body.appendChild(burst);
        updateCounter(1);

        setTimeout(() => burst.remove(), 1200);
      }
    }

    window.addEventListener('click', (e) => {
      // Don't trigger if clicked on control bar
      if (e.target.closest('header') || e.target.closest('button')) return;
      triggerBurst(e.clientX, e.clientY);
    });

    // --- CONTROLS LOGIC ---
    let floatInterval;
    function resetIntervals() {
      clearInterval(floatInterval);
      const intervalTime = Math.max(200, 1000 / (1.5 * speedMultiplier));
      floatInterval = setInterval(() => {
        if (!isPaused) spawnFloatingCard();
      }, intervalTime);
    }

    function setSpeed(mode) {
      const btnSlow = document.getElementById('btnSpeedSlow');
      const btnNormal = document.getElementById('btnSpeedNormal');
      const btnInsane = document.getElementById('btnSpeedInsane');

      [btnSlow, btnNormal, btnInsane].forEach(b => {
        b.className = "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
      });

      if (mode === 'slow') {
        speedMultiplier = 0.5;
        btnSlow.className = "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-sky-600 text-white shadow-lg shadow-sky-600/40 transition";
      } else if (mode === 'normal') {
        speedMultiplier = 1;
        btnNormal.className = "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-purple-600 text-white shadow-lg shadow-purple-600/40 transition";
      } else if (mode === 'insane') {
        speedMultiplier = 3;
        btnInsane.className = "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-gradient-to-r from-pink-500 to-rose-600 text-white shadow-lg shadow-pink-500/40 transition";
      }

      resetIntervals();
    }

    function togglePause() {
      isPaused = !isPaused;
      const btn = document.getElementById('btnPause');
      btn.textContent = isPaused ? "▶️ Continuar" : "⏸️ Pausar";
      btn.className = isPaused 
        ? "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 text-white shadow-lg shadow-emerald-600/40 transition"
        : "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-amber-400 hover:bg-amber-950/50 transition";
    }

    function clearScreen() {
      bubblesContainer.innerHTML = '';
      ctx.clearRect(0, 0, width, height);
    }

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      drawMatrix();
      requestAnimationFrame(animate);
    }

    // Start
    resetIntervals();
    animate();
  </script>
</body>
</html>
